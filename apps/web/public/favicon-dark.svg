<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-gradient" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </radialGradient>

    <!-- Subtle Developer Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#000000" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Premium Gradients for the 3D Isometric Shapes -->
    <linearGradient id="top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>

    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>

    <linearGradient id="right-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Edge Highlights for that crisp machined look -->
    <linearGradient id="top-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="left-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="right-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#71717A" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadows for Light Mode -->
    <filter id="shadow-deep" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    
    <filter id="shadow-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Base App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  
  <!-- Outer Rim Lighting -->
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="#D4D4D8" stroke-width="1" stroke-opacity="0.8"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Logo Core: Floating Isometric Prism -->
  <!-- Right Diamond (Bottom Layer) -->
  <path d="M 266 262 L 404 182 L 404 342 L 266 422 Z" 
        fill="url(#right-grad)" 
        stroke="url(#right-edge)" stroke-width="1"
        filter="url(#shadow-deep)"/>

  <!-- Left Diamond (Middle Layer) -->
  <path d="M 246 262 L 108 182 L 108 342 L 246 422 Z" 
        fill="url(#left-grad)" 
        stroke="url(#left-edge)" stroke-width="1.5" 
        filter="url(#shadow-medium)"/>

  <!-- Top Diamond (Top Layer) -->
  <path d="M 256 244 L 394 164 L 256 84 L 118 164 Z" 
        fill="url(#top-grad)" 
        stroke="url(#top-edge)" stroke-width="2"
        filter="url(#shadow-deep)"/>
</svg>