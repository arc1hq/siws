name: Publish Packages

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siws/core build
      - run: pnpm --filter @siws/core --filter @siws/better-auth check-types
      - run: pnpm --filter @siws/core --filter @siws/better-auth lint

  check-versions:
    runs-on: ubuntu-latest
    outputs:
      core-changed: ${{ steps.check.outputs.core-changed }}
      better-auth-changed: ${{ steps.check.outputs.better-auth-changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare local versions against npm registry
        id: check
        run: |
          CORE_LOCAL=$(jq -r '.version' packages/core/package.json)
          BETTER_AUTH_LOCAL=$(jq -r '.version' packages/better-auth/package.json)

          CORE_NPM=$(npm view @siws/core version 2>/dev/null || echo "0.0.0")
          BETTER_AUTH_NPM=$(npm view @siws/better-auth version 2>/dev/null || echo "0.0.0")

          echo "core: npm=$CORE_NPM local=$CORE_LOCAL"
          echo "better-auth: npm=$BETTER_AUTH_NPM local=$BETTER_AUTH_LOCAL"

          if [ "$CORE_LOCAL" != "$CORE_NPM" ]; then
            echo "core-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "core-changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$BETTER_AUTH_LOCAL" != "$BETTER_AUTH_NPM" ]; then
            echo "better-auth-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "better-auth-changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-core:
    needs: [check, check-versions]
    if: needs.check-versions.outputs.core-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siws/core build
      - run: npm publish --access public --provenance
        working-directory: packages/core

  publish-better-auth:
    needs: [check, check-versions, publish-core]
    if: |
      always() &&
      needs.check.result == 'success' &&
      needs.check-versions.outputs.better-auth-changed == 'true' &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siws/core build
      - run: pnpm --filter @siws/better-auth build
      - run: npm publish --access public --provenance
        working-directory: packages/better-auth
